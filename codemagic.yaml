workflows:
  capacitor-ios-build:
    name: Capacitor iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install & Sync
        script: |
          npm install
          npx cap add ios || npx cap sync ios
      - name: Install Pods
        script: |
          cd ios/App && pod install && cd ../..
      - name: Build Archive
        script: |
          xcodebuild -workspace "ios/App/App.xcworkspace" -scheme "App" -configuration Release -sdk iphoneos -archivePath build/ios/archive.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Export IPA
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath build/ios/archive.xcarchive -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
