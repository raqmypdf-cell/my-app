workflows:
  capacitor-ios-build:
    name: Capacitor iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install & Sync
        script: |
          npm install
          npx cap add ios || npx cap sync ios
      - name: Install Pods
        script: |
          cd ios/App && pod install && cd ../..
      - name: Build Archive
        script: |
          xcodebuild -workspace "ios/App/App.xcworkspace" -scheme "App" -configuration Release -sdk iphoneos -archivePath build/ios/archive.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package Valid IPA
        script: |
          mkdir -p build/ios/ipa
          # نسخ ملف التطبيق من الأرشيف
          APP_PATH=$(find build/ios/archive.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          # إنشاء هيكلية Payload الصحيحة التي يطلبها iOS
          cd build/ios/archive.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r "$APP_NAME.app" Payload/
          zip -r ../../../ipa/"${APP_NAME}.ipa" Payload/
          rm -rf Payload
    artifacts:
      - build/ios/ipa/*.ipa
