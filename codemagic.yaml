workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Dependencies
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Build & Archive
        script: |
          xcodebuild -workspace "*.xcworkspace" -scheme "MyApp" -configuration Release -sdk iphoneos -archivePath build/ios/archive.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Export IPA
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath build/ios/archive.xcarchive -exportPath build/ios/ipa -exportOptionsPlist exportOptions.plist || xcodebuild -exportArchive -archivePath build/ios/archive.xcarchive -exportPath build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
