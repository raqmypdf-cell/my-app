<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>بوابة مدارس دار الفكر</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f5f7fa; }
    .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-family: system-ui, -apple-system, sans-serif; color: #333; background: #fff; z-index: 9999; transition: opacity 0.3s; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    const TARGET_URL = "https://fikr.edu.sa/main/fikr-portals/?lang=ar";
    // نستخدم assign بدل replace عشان يتوافق مع سياسات WebView الحديثة
    window.location.assign(TARGET_URL);
    
    // إخفاء شاشة التحميل عند بدء التنقل
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      if(loader) loader.style.opacity = '0';
      setTimeout(() => loader?.remove(), 300);
    });
  </script>
</head>
<body>
  <div id="loader" class="loading">
    <div class="spinner"></div>
    <p>جاري تحميل البوابة...</p>
  </div>
</body>
</html>
