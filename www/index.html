<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مدارس دار الفكر</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8f9fa; }
    .loader { display: flex; justify-content: center; align-items: center; height: 100%; font-family: system-ui, -apple-system, sans-serif; color: #495057; font-size: 16px; }
  </style>
  <script>
    // 🔗 رابط موقعك
    const TARGET_URL = "https://fikr.edu.sa/main/fikr-portals/?lang=ar";
    
    // التحويل المباشر (الأفضل والأكثر استقراراً للـ WebView)
    window.location.replace(TARGET_URL);
  </script>
</head>
<body>
  <div class="loader">جاري تحميل بوابة الفكر...</div>
  <script>
    // إخفاء شاشة التحميل بعد اكتمال التنقل أو بعد 2 ثانية كحد أقصى
    window.addEventListener('load', () => {
      const loader = document.querySelector('.loader');
      if (loader) loader.style.display = 'none';
    });
    setTimeout(() => document.querySelector('.loader').style.display = 'none', 2000);
  </script>
</body>
</html>
